server {
    listen 80;
    listen [::]:80;
    server_name xn--3-gtbcaaltd9abodcu.xn--p1ai www.xn--3-gtbcaaltd9abodcu.xn--p1ai;

    root /var/www/timetracker;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
